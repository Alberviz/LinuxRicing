<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escaparate · Tele</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #05060a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 3rem;
      border-radius: 2rem;
      background: radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.4) 0%, rgba(5, 6, 10, 0.8) 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 1s ease-out;
    }
    .badge {
      display: inline-block;
      font-family: "JetBrainsMono Nerd Font", monospace;
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 0.4rem 1.2rem;
      border-radius: 9999px;
      margin-bottom: 2rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .clock {
      font-size: 8rem;
      font-weight: 200;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }
    .seconds {
      font-size: 3.5rem;
      opacity: 0.6;
      font-weight: 300;
    }
    .date {
      font-size: 1.8rem;
      font-weight: 400;
      color: #94a3b8;
      margin-bottom: 2rem;
      text-transform: capitalize;
    }
    .status {
      font-size: 1rem;
      color: #64748b;
      font-family: "JetBrainsMono Nerd Font", monospace;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 12px #10b981;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Escaparate · Tele Salón</div>
    <div class="clock" id="clock">00:00<span class="seconds" id="seconds">:00</span></div>
    <div class="date" id="date">Cargando fecha…</div>
    <div class="status"><span class="dot"></span>Modo descanso · Caelestia Shell</div>
  </div>

  <script>
    function update() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').innerHTML = `${h}:${m}<span class="seconds">:${s}</span>`;

      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options);
    }
    setInterval(update, 1000);
    update();
  </script>
</body>
</html>
