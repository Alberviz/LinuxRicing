[Service]
# Habilita Flash Attention 2 nativo para la arquitectura Ada Lovelace (RTX 4050)
Environment="OLLAMA_FLASH_ATTENTION=1"
# Cuantiza la caché KV a 8 bits: reduce al 50% el consumo de VRAM de los 6144 tokens de contexto
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Mantiene el modelo en VRAM caliente durante 20 minutos para respuestas inmediatas
Environment="OLLAMA_KEEP_ALIVE=20m"
