<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Salud en el sistema solar — variantes</title>
<!-- Mockup de docs/sistema-solar-salud-DISENO.md. Fondo = recorte real del escritorio
     (zona libre abajo-derecha, x 1160-1920, y 330-890). Datos = /v1/summary real del
     2026-10-26 (últimos 7 días). Captura:
     chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1560,1240 \
       --virtual-time-budget=1500 --screenshot=salud-variantes.png "file://$PWD/salud-variantes.html" -->
<style>
  :root { --bg:#0b0a10; --card:#14121b; --ink:#f3e9dc; --dim:#9a8f86; --pri:#ffb59a; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 ui-monospace, "JetBrains Mono", monospace; padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(2, 760px); gap:12px; }
  .card { background:var(--card); border-radius:12px; overflow:hidden; border:1px solid #ffffff10; }
  .cap { padding:8px 12px; } .cap h2 { margin:0; font-size:12px; letter-spacing:2px; color:var(--pri); }
  .cap p { margin:2px 0 0; color:var(--dim); font-size:12px; }
  canvas { display:block; }
</style></head><body>
<div class="grid" id="g"></div>
<script>
const GOAL = 10000, SLEEP_GOAL = 7.5, WEEK_GOAL = 4;
// daily[] real, 2026-10-20 … 2026-10-26 (hoy, parcial: Zepp va con retraso)
const REAL = [
  { d: "L", steps: 8161, sleep: 2.58, wk: 0, hab: 0 },
  { d: "M", steps: 4613, sleep: 5.95, wk: 0, hab: 0 },
  { d: "X", steps: 11213, sleep: 1.43, wk: 0, hab: 0 },
  { d: "J", steps: 660, sleep: 9.13, wk: 0, hab: 1 },
  { d: "V", steps: 1700, sleep: 7.75, wk: 0, hab: 0 },
  { d: "S", steps: 6919, sleep: 0.55, wk: 0, hab: 0 },
  { d: "D", steps: 330, sleep: 4.97, wk: 0, hab: 0 },
];
// Semana «buena» inventada para ver el concepto lleno (racha, lunas, hábitos)
const GOOD = [
  { d: "L", steps: 12040, sleep: 7.6, wk: 1, hab: 1 },
  { d: "M", steps: 10480, sleep: 6.9, wk: 0, hab: 1 },
  { d: "X", steps: null, sleep: null, wk: 0, hab: 0 },
  { d: "J", steps: 10900, sleep: 7.9, wk: 1, hab: 1 },
  { d: "V", steps: 13020, sleep: 7.1, wk: 1, hab: 1 },
  { d: "S", steps: 9100, sleep: 8.2, wk: 0, hab: 0 },
  { d: "D", steps: 7400, sleep: 7.2, wk: 0, hab: 1 },
];
const PRI = [255, 181, 154], INK = [243, 233, 220], DIM = [154, 143, 134];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const bg = new Image(); bg.src = "salud-fondo.png";

function label(x, c, y, main, sub, a = 1) {
  x.font = "600 11px ui-monospace, monospace"; x.fillStyle = rgba(INK, .78 * a);
  x.letterSpacing = "2px"; x.fillText(main, c, y);
  x.font = "10px ui-monospace, monospace"; x.fillStyle = rgba(DIM, .9 * a); x.letterSpacing = "1px";
  sub.forEach((s, i) => x.fillText(s, c, y + 15 + i * 13));
}

// ---------- A · Planeta «Cuerpo» ----------
function planet(x, week, mode) {
  const cx = 400, cy = 300, R = 21, today = week[6];
  const none = mode === "none", stale = mode === "stale";
  const a = none ? .28 : 1;
  // anillo de pasos (órbita) — arco = pasos de hoy / meta
  const OR = 62, frac = none ? 0 : Math.min(1, (stale ? week[5].steps : today.steps || 0) / GOAL);
  x.save(); x.translate(cx, cy); x.scale(1, .42);
  x.lineWidth = 1.2 / .42 * .5; x.strokeStyle = rgba(PRI, .13 * a);
  if (none) x.setLineDash([3, 5]);
  x.beginPath(); x.arc(0, 0, OR, 0, 2 * Math.PI); x.stroke(); x.setLineDash([]);
  if (frac > 0) {
    x.lineWidth = 2.2; x.strokeStyle = rgba(stale ? DIM : PRI, stale ? .55 : .85);
    x.beginPath(); x.arc(0, 0, OR, -Math.PI / 2, -Math.PI / 2 + frac * 2 * Math.PI); x.stroke();
  }
  x.restore();
  if (frac > 0) { // sonda en la punta del arco
    const th = -Math.PI / 2 + frac * 2 * Math.PI;
    const px = cx + OR * Math.cos(th), py = cy + OR * .42 * Math.sin(th);
    const g = x.createRadialGradient(px, py, 0, px, py, 9);
    g.addColorStop(0, rgba(stale ? DIM : INK, .9)); g.addColorStop(1, rgba(PRI, 0));
    x.fillStyle = g; x.beginPath(); x.arc(px, py, 9, 0, 7); x.fill();
  }
  // halo del planeta: sólo si hoy se cumple la meta
  if (!none && frac >= 1) {
    const g = x.createRadialGradient(cx, cy, R, cx, cy, R * 2.6);
    g.addColorStop(0, rgba(PRI, .30)); g.addColorStop(1, rgba(PRI, 0));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R * 2.6, 0, 7); x.fill();
  }
  // esfera
  const g = x.createRadialGradient(cx - 7, cy - 8, 2, cx, cy, R);
  g.addColorStop(0, rgba([255, 226, 210], .95 * a)); g.addColorStop(.6, rgba(PRI, .85 * a)); g.addColorStop(1, rgba([120, 70, 60], .9 * a));
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();
  // terminador = sueño de anoche (fracción iluminada); sin dato → sin terminador
  const sl = stale ? week[5].sleep : today.sleep;
  if (!none && sl != null) {
    const lit = Math.min(1, sl / SLEEP_GOAL);
    x.save(); x.beginPath(); x.arc(cx, cy, R, 0, 7); x.clip();
    x.fillStyle = "rgba(8,6,10,.78)";
    x.beginPath(); x.ellipse(cx + R * 2 * lit, cy, R * 1.25, R * 1.4, 0, 0, 7); x.fill();
    x.restore();
  }
  // lunas = entrenos de la semana (llenas) sobre la meta semanal (huecas)
  const done = week.reduce((s, d) => s + d.wk, 0);
  for (let i = 0; i < WEEK_GOAL; i++) {
    const th = 0.6 + i * (2 * Math.PI / WEEK_GOAL), mx = cx + 36 * Math.cos(th), my = cy + 36 * .55 * Math.sin(th);
    x.beginPath(); x.arc(mx, my, 3.2, 0, 7);
    if (i < done && !none) { x.fillStyle = rgba(INK, .9); x.fill(); }
    else { x.lineWidth = 1; x.strokeStyle = rgba(DIM, .35 * a); x.stroke(); }
  }
  // racha: 7 cuentas bajo el planeta (una por día, la última = hoy)
  week.forEach((d, i) => {
    const bx = cx - 66 + i * 22, by = cy + 62;
    const f = d.steps == null || none ? null : Math.min(1, d.steps / GOAL);
    x.beginPath(); x.arc(bx, by, f != null && f >= 1 ? 4 : 3, 0, 7);
    if (f == null) { x.lineWidth = 1; x.strokeStyle = rgba(DIM, .3); x.stroke(); }
    else { x.fillStyle = f >= 1 ? rgba(PRI, .95) : rgba(PRI, .15 + .45 * f); x.fill(); }
    if (i === 6) { x.lineWidth = 1; x.strokeStyle = rgba(INK, .5 * a); x.beginPath(); x.arc(bx, by, 7, 0, 7); x.stroke(); }
    if (d.hab && !none) { x.fillStyle = rgba(INK, .7); x.fillRect(bx - .8, by - 10, 1.6, 1.6); }
  });
  const s = none ? ["sin datos del reloj"]
        : stale ? ["ayer " + week[5].steps.toLocaleString("es") + " pasos", "reloj: hace 9 h"]
        : [(today.steps || 0).toLocaleString("es") + " / 10.000 pasos",
           "sueño " + (today.sleep ?? "—") + " h · " + done + "/4 entrenos", "sync 16:00"];
  label(x, cx + 82, cy - 6, "CUERPO", s, none ? .55 : 1);
}

// ---------- C · Constelación de la semana ----------
function constellation(x, week) {
  const pts = [[150, 380], [215, 318], [300, 300], [372, 236], [450, 262], [520, 196], [600, 226]];
  for (let i = 0; i < 6; i++) {
    const a = week[i], b = week[i + 1];
    if (a.steps == null || b.steps == null) continue; // hueco: la línea se rompe
    const both = a.steps >= GOAL && b.steps >= GOAL;
    x.strokeStyle = rgba(PRI, both ? .6 : .14); x.lineWidth = both ? 1.4 : 1;
    x.beginPath(); x.moveTo(...pts[i]); x.lineTo(...pts[i + 1]); x.stroke();
  }
  week.forEach((d, i) => {
    const [px, py] = pts[i];
    if (d.steps == null) { x.fillStyle = rgba(DIM, .35); x.font = "10px monospace"; x.fillText("·", px - 2, py + 3); return; }
    const f = Math.min(1.3, d.steps / GOAL), r = 1.5 + 3.2 * f;
    const g = x.createRadialGradient(px, py, 0, px, py, r * 4);
    g.addColorStop(0, rgba(INK, .25 + .7 * Math.min(1, f))); g.addColorStop(.25, rgba(PRI, .25 * f)); g.addColorStop(1, rgba(PRI, 0));
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r * 4, 0, 7); x.fill();
    x.fillStyle = rgba(INK, .9); x.beginPath(); x.arc(px, py, r * .55, 0, 7); x.fill();
    if (d.wk) { // destello de 4 puntas = entreno
      x.strokeStyle = rgba(INK, .55); x.lineWidth = 1;
      x.beginPath(); x.moveTo(px - 12, py); x.lineTo(px + 12, py); x.moveTo(px, py - 12); x.lineTo(px, py + 12); x.stroke();
    }
    if (d.sleep != null) { // aro = sueño
      x.strokeStyle = rgba(PRI, .25); x.beginPath(); x.arc(px, py, 6 + 6 * Math.min(1, d.sleep / SLEEP_GOAL), 0, 7); x.stroke();
    }
    x.fillStyle = rgba(DIM, .7); x.font = "9px monospace"; x.fillText(d.d, px - 3, py + 26);
  });
  label(x, 470, 400, "SEMANA", ["hoy " + (week[6].steps ?? 0).toLocaleString("es") + " pasos", "racha: líneas brillantes"]);
}

const PANELS = [
  ["A · PLANETA «CUERPO» — datos reales (hoy parcial)", "Arco = pasos hoy/meta · terminador = sueño · lunas = entrenos/semana · cuentas = 7 días", x => planet(x, REAL, "ok")],
  ["A · PLANETA «CUERPO» — semana completa (inventada)", "Meta cumplida: arco cerrado + halo. Día sin datos = cuenta hueca. Marca sobre la cuenta = hábito", x => planet(x, GOOD, "ok")],
  ["A · estados degradados — atrasado (izq.) y sin datos (dcha.)", "Atrasado: arco gris con el último día bueno. Sin datos/credenciales: contorno tenue, nada roto", x => { x.save(); x.translate(-170, 0); planet(x, REAL, "stale"); x.restore(); x.save(); x.translate(110, 0); planet(x, REAL, "none"); x.restore(); }],
  ["C · CONSTELACIÓN DE LA SEMANA — semana completa (inventada)", "Estrella = día (tamaño ∝ pasos) · línea viva = racha · cruz = entreno · aro = sueño · hueco = sin datos", x => constellation(x, GOOD)],
];
bg.onload = () => {
  for (const [t, p, draw] of PANELS) {
    const card = document.createElement("div"); card.className = "card";
    const c = document.createElement("canvas"); c.width = 760; c.height = 560;
    const x = c.getContext("2d"); x.drawImage(bg, 0, 0); draw(x);
    card.append(c); card.insertAdjacentHTML("beforeend", `<div class="cap"><h2>${t}</h2><p>${p}</p></div>`);
    document.getElementById("g").append(card);
  }
};
</script></body></html>
