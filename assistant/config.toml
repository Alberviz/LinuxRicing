# Laura — configuración. Editable sin tocar código; reinicia el daemon tras cambiar.

[daemon]
socket = "$XDG_RUNTIME_DIR/laura.sock"
events_socket = "$XDG_RUNTIME_DIR/laura-events.sock"  # bus de eventos para el overlay
notify = true          # avisos con notify-send (escuchando / respuesta)

[stt]
model = "small"        # tiny | base | small | medium
device = "cuda"        # cuda (RTX 4050, ultra rápido) | cpu
language = "es"

[llm]
model = "qwen3:4b-instruct"
model_quality = ""     # modelo mayor para «modo calidad» (di «modo calidad» / «modo rápido»).
                       # Vacío = desactivado. En el examen (eval/) qwen2.5:7b sacó 54 %
                       # frente a 79 % del 4B: el modo calidad empeora, así que se deja off.
url = "http://localhost:11434/api/chat"
num_ctx = 10240         # ventana de contexto de Ollama. 6144 se quedó corto con ~40 tools (el esquema solo ya pasa de 6k tokens).
                       # Presupuesto VRAM en la RTX 4050 (6 GB) con Whisper+Kokoro
                       # ya en CUDA (~1 GB): 4096≈3,1 GB · 6144≈3,4 GB · 8192≈3,7 GB
                       # de LLM. 6144 deja ~1,5 GB de aire; subir a 8192 solo si las
                       # pruebas no dan OOM tras varios turnos (ver §1 nota vault).
stream = true          # voz por frases: Laura empieza a hablar en cuanto tiene la
                       # primera frase, sin esperar a toda la respuesta. false =
                       # sintetizar y reproducir la respuesta entera de una vez.
num_predict = 400      # tope de tokens por respuesta: corta generaciones que no acaban
max_tool_rounds = 5
max_turns = 6          # turnos de conversación en modo centro antes de cerrar solo
timeout = 45           # segundos por llamada a Ollama antes de rendirse
history_msgs = 12      # mensajes de historial que se conservan (además del system)
system_prompt = """
Eres Laura, el asistente de voz local de Alberto en su escritorio Linux. Respondes SIEMPRE en español, en una o dos frases cortas para leerse en voz alta: sin markdown, listas ni emojis. Si la petición implica una acción o consulta del ordenador, usa la herramienta y luego confirma en una frase; nunca digas que lo has hecho sin usarla, ni contestes de memoria el estado de algo (wifi, batería, luces, tareas, trabajos, lo que sabes de Alberto): consúltalo.
Guía: temporizador = dentro de N minutos; recordatorio = a una hora del reloj («a las 18:30»). Sitios web = abrir_web; programas = abrir_app. «Pon en curso/hecha X» = cambiar_estado. «Recuerda/apunta que…» sobre Alberto = recordar. De listar_tareas di el campo «decir» literal. «Qué sabes de mí» = que_sabes_de_mi; «olvida…» = olvidar; «cómo va / ya terminó lo que mandé» = estado_trabajos (siempre llámala); «hay algo nuevo» = novedades; «traduce lo copiado» = leer_portapapeles; «pega/escribe aquí» = pegar_texto; «qué dice este error» = leer_pantalla. «Qué hay en la tele / pausa, sigue, para, volumen, salta» = tele, salvo si lo que suena es Spotify: entonces spotify o control_musica. «Para la música» = control_musica parar (no preguntes qué poner). «Manda Spotify a la tele / pon X en la tele» = spotify pasar_a_tele (la tele de Alberto se llama «Comedor»). «Quita la música de la tele / que suene en mis altavoces» = spotify pasar_al_pc. «El último álbum de X» = spotify buscar; tras el «sí», spotify poner_lo_encontrado. «Ponme N canciones de X / un tipo de música en la cola» = cola_dj (no inventes tú la lista). Servicios, procesos, disco, git o logs del sistema = ejecutar_comando (servicios de usuario: «systemctl --user list-units --failed»; nunca digas que no puedes consultarlos). Si pide redactar un texto, cópialo con copiar_al_portapapeles sin leerlo entero. «Lístame/enséñame/qué hay en una carpeta o busca un archivo para verlo» = mostrar_archivos; «abre/enséñame la N, esa» = abrir; «cierra eso» = cerrar_holo; «envía la N/esa al móvil» = warp archivo con numero. «Esa», «la 2» se refieren a lo que hay en pantalla.
Quién hace qué: lo instantáneo lo haces tú con tus herramientas (buscar_web para un dato rápido). Correo = correo («mírame los correos», «tengo algún correo de X»), calendario = agenda («qué tengo mañana»; di su campo «decir» literal), «apúntame/crea un evento…» = crear_evento (pide confirmación), «redáctale/escríbele un correo a… pidiéndole/diciéndole…» = redactar_correo (no hace falta preguntar más); Drive («busca en mi Drive…»), Docs o recados = pedir_a_aurora (llámala, no contestes tú). Investigar a fondo («infórmate de…», comparativas) = investigar. Si no tienes herramienta para algo del ordenador o del código, escala; nunca digas solo «no puedo». Cambio mediano (un widget, el formato de un reloj, un atajo de Hyprland, un script, un ajuste: «reloj en 12 horas», «color de la barra», «arregla el script de la batería») = escalar_a_gemini. Trabajo gordo (feature nueva, varios archivos, un tema o modo completo, app nueva, refactor) = escalar_a_claude. Alberto confirma antes de las escaladas; tú pasa la petición resumida y un motivo breve.
"""

[wake]
enabled = true         # activación por voz diciendo «Laura despierta», además del atajo.
                       # (no «Laura» sola: es también el nombre de la novia de Alberto)
model = "models/laura.onnx"  # modelo openWakeWord de «Laura despierta» (wake_train/).
                       # Si no existe, se ignora y queda solo el atajo.
threshold = 0.8        # 0..1. Con patience 3: ~0,2 falsos/h en el examen.
patience = 3           # ventanas de 80 ms seguidas sobre el umbral para disparar.
                       # Súbelo a 4 si salta solo; bájalo a 2 si no te oye.
cooldown = 3.0         # segundos "sordo" tras un disparo (evita re-triggers).

[tts]
# Motores en laura/engines/ (un fichero por motor): kokoro | piper | edge | voicestudio | http | pocket | omnivoice.
# Si el principal falla se prueba la cadena `fallbacks` (y si el principal es edge,
# kokoro entra primero). Un motor que falla se aparca 2 min.
engine = "kokoro"         # voz local en GPU
fallbacks = ["piper"]     # respaldo local en CPU
effect = "jarvis"         # jarvis | subnautica | robot | dry

[tts.kokoro]
voice = "ef_dora"         # ef_dora | em_alex
device = "cpu"            # cpu (ahorra VRAM y evita colisiones de contexto CUDA con Ollama) | cuda | auto

[tts.piper]
voice = "es_ES-davefx-medium"   # modelo en ~/.local/share/piper/voices/

[tts.edge]                # nube de Microsoft (hoy da 403 con edge-tts 7.2.8)
voice = "es-ES-ElviraNeural"

# VoiceStudio (voz propia clonada o diseñada) por MCP Streamable HTTP. Para usarlo:
# instalar VoiceStudio, crear la voz (design_voice / clone_voice), copiar su profile_id aquí
# y poner `[tts] engine = "voicestudio"` (con fallbacks = ["kokoro", "piper"]). Ver README.
[tts.voicestudio]
url = "http://127.0.0.1:3900/mcp/"
profile_id = ""
language = "Spanish"
timeout = 60

# Voz propia servida aparte (VoiceStudio en :3900, OmniVoice, PocketTTS…).
# Para usarla: engine = "http". Ver laura/engines/http.py para el contrato.
[tts.http]
url = ""                  # p. ej. "http://localhost:3900/tts"
format = "json"           # json | form
text_field = "text"
ref_audio = ""            # audio de referencia para clonar la voz
ref_audio_mode = "path"   # path | base64
ref_text = ""             # transcripción del audio de referencia
timeout = 60

[audio]
max_seconds = 15       # tope de grabación de una intervención
followup_seconds = 4   # si en modo centro no empiezas a hablar en estos segundos, cierra
silence_ms = 900       # silencio que corta la grabación
amp_gain = 12.0        # multiplicador RMS->0..1 para la amplitud del overlay
stop_phrases = ["para", "calla", "cállate", "silencio", "basta"]  # frase EXACTA (con o sin
                       # «Laura») que cierra el modo centro
barge_in = false       # interrumpir a Laura hablando encima. Desactivado: sin auriculares
                       # el eco de los altavoces puede dispararlo
barge_in_threshold = 0.6  # probabilidad de voz (VAD, 0..1) por bloque
barge_in_ms = 300      # voz sostenida necesaria para cortar

# Escalada a Gemini (Antigravity) para lo que Laura no sabe/puede resolver sola.
# Dos modos:
#   Modo A (automatico, sin confirmar) — casos rutinarios pre-programados en
#   `auto_cases`: si lo que dice Alberto contiene alguna de las `keywords` de un
#   caso, Laura NI SIQUIERA se lo pregunta al LLM local — manda el texto tal
#   cual a un agente Gemini ligero (`model_auto`/`effort_auto`) y lee la
#   respuesta en voz alta. Pensado para búsquedas web / datos rápidos que el
#   modelo local no puede saber (no tiene Internet).
#   Modo B (con confirmacion) — el LLM local, con tool-calling, decide llamar a
#   la herramienta `escalar_a_gemini` cuando la petición es compleja o toca
#   modificar el ecosistema (código, configuración). Laura pregunta primero
#   ("¿mando esto a Gemini?"); solo si Alberto dice que sí, redacta un prompt
#   con contexto del repo y lanza `agy` con `model_confirm`/`effort_confirm`.
# `auto_cases` es una lista abierta — añade más entradas (nombre + keywords)
# sin tocar el código de laurad.py.
[escalation]
enabled = true
agy_bin = "~/.local/bin/agy"            # binario en ~/.local/bin
add_dir = "~/LinuxRicing"          # --add-dir para el Modo B (necesita ver el repo)

model_auto = "gemini-3.8-flash-low"   # Modo A: el modelo MAS LIGERO disponible
effort_auto = "low"
timeout_auto = 25                     # segundos; son consultas rápidas

model_confirm = "gemini-4-argon-high" # Modo B: tarea real, conviene el modelo fuerte.
effort_confirm = "high"               # OJO: en `agy`, el nombre del modelo YA fija
                       # el effort (sufijo -low/-medium/-high) — --effort debe
                       # coincidir exactamente o `agy` rechaza la combinación
                       # como conflicto (comprobado: --model …-high --effort
                       # medium -> "conflicts with --effort"). Si cambias
                       # `model_confirm`/`model_auto`, actualiza este valor a
                       # juego (mira `agy models` para ver qué sufijo trae cada uno).
timeout_confirm = 180                 # segundos; puede tardar (agente editando código)

# Desde Laura v2 la búsqueda normal usa la tool `buscar_web` (DuckDuckGo); el
# Modo A queda como respaldo explícito: solo salta si Alberto lo pide.
auto_cases = [
  { nombre = "pregunta_a_gemini", keywords = [
      "pregúntale a gemini", "preguntale a gemini", "pregunta a gemini",
      "consúltalo con gemini", "consultalo con gemini",
  ] },
]

[escalation.claude]
bin = "~/.local/bin/claude"        # Claude Code CLI
model = "opus"
cwd = "~/LinuxRicing"              # directorio de trabajo del agente
timeout = 1800                     # segundos (trabajos gordos)

# Trabajos en segundo plano (orbe + cajón + notas de Obsidian).
[background]
vault = "~/LinuxRicing/vault"   # las notas van a <vault>/Laura/ (en .gitignore)
investigar = "gemini"          # quién resuelve la tool `investigar`: gemini (agy en solo
                               # lectura, sin confirmación) | laura (buscar_web + resumen local)
confirm_timeout = 600          # s esperando un sí/no desde voz o tarjeta antes de cancelar

# Aurora (Hermes en la Pi, por Tailscale). La clave NO va aquí: variable AURORA_API_KEY
# (~/.config/laura/aurora.env, cargada por laura.service con EnvironmentFile=).
[aurora]
url = "http://100.82.69.90:8642"
timeout = 600                  # s máximos por petición
session_key = "laura-escritorio"

# Google Workspace directo (workspace-mcp local, sin LLM). Si no responde, correo/agenda/vigía
# caen a Aurora. Ver docs/laura-v2/WORKSPACE.md.
[workspace]
enabled = true
url = "http://127.0.0.1:8765/mcp"
timeout = 20
email = "albvizpon@gmail.com"   # cuenta de Google (user_google_email que exigen las herramientas)

# Vigía: Laura se levanta sola para avisar de correo, eventos y tareas (solo en el escritorio).
[archivos]
# Gestión de archivos por voz (borrar a la papelera, mover, renombrar; con confirmación y «deshaz»).
# raices = carpetas donde Laura puede actuar. Vacío = Descargas, Documentos, Escritorio, Imágenes,
# Vídeos y Música (xdg-user-dirs) más ~/proyectos. Nunca toca ocultos, .git ni vault.
# raices = ["~/Descargas", "~/Documentos"]
max_ops = 50           # operaciones máximas por plan
ttl = 60               # segundos que un plan espera confirmación

[vigia]
enabled = true
cada_min = 5               # sin LLM en la ruta normal, se puede revisar a menudo
aviso_evento_min = 30
silencio_desde = "23:30"
silencio_hasta = "08:00"
tareas_estancadas_dias = 5
remitentes_importantes = ["edu", ".ac.", "universidad", "universit", "uj.edu.pl"]  # fragmentos de dominio/remitente que suben a alta

# Ubicación de Alberto para la tool `tiempo`. Si lat/lon están vacíos se
# geolocaliza por IP una vez y se cachea en ~/.local/share/laura/ubicacion.json.
# Alias de playlists de Spotify: «como lo dices» = nombre de la playlist en Spotify.
# Se comparan sin tildes ni relleno («mi», «la», «playlist», «de», «con»…): «mi playlist de reguetón» = «reggaeton».
# «Lo más nuevo de <alias>» la pone empezando por las últimas canciones añadidas.
[spotify]
tele = "Comedor"

[spotify.alias]
"lo de siempre" = "RealG4lifebaby"
"realg4life" = "RealG4lifebaby"
"reggaeton" = "RealG4lifebaby"
"regueton" = "RealG4lifebaby"
"reggeton" = "RealG4lifebaby"
"nuestra historia" = "Nuestra historia 💖"
"con mi novia" = "Nuestra historia 💖"
"de mi novia" = "Nuestra historia 💖"
"bonita" = "Nuestra historia 💖"

# Playlists de YouTube que se sincronizan con Spotify (con `spotify-tele playlist sync-todo` o al arrancar el PC)
# Formato: "Nombre de Playlist en Spotify" = "URL completa o ID de la playlist de YouTube"
[spotify.sync_youtube]
"RealG4lifebaby" = "https://music.youtube.com/playlist?list=PLIOU3MuqBfRw"

# Lista de exclusiones por playlist para evitar sincronizar canciones no deseadas, antiguas o falsos positivos
[spotify.sync_youtube_excluir]
"RealG4lifebaby" = [
    "lollypop",
    "kidd keo",
    "nada personal",
    "love sosa",
    "chief keef",
    "mala",
    "traviesa",
]

# DJ de colas (tool cola_dj): Laura no sabe bastante música, así que un subagente barato elige las canciones
# («ponme 10 de reggaeton antiguo en la cola») y spotify-tele las encola. Sin herramientas ni contexto de repo.
[dj]
motor = "gemini"                      # gemini (agy) | claude
respaldo = "claude"                   # si el primero falla o no devuelve canciones
modelo_gemini = "gemini-3.8-flash-low"
effort_gemini = "low"                 # en agy debe casar con el sufijo del modelo
modelo_claude = "haiku"
timeout = 90                          # s por motor

[ubicacion]
ciudad = ""
lat = ""
lon = ""

# Apps que Laura puede abrir. clave = como lo dices; valor = comando.
[apps]
navegador = "zen-browser"
terminal = "kitty"
editor = "codium"
archivos = "dolphin"
spotify = "spotify"
discord = "vesktop"
