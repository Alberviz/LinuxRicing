# Laura — configuración. Editable sin tocar código; reinicia el daemon tras cambiar.

[daemon]
socket = "$XDG_RUNTIME_DIR/laura.sock"
events_socket = "$XDG_RUNTIME_DIR/laura-events.sock"  # bus de eventos para el overlay
notify = true          # avisos con notify-send (escuchando / respuesta)

[stt]
model = "small"        # tiny | base | small | medium
device = "cuda"        # cuda (RTX 4050, ultra rápido) | cpu
language = "es"

[llm]
model = "qwen3:4b-instruct"
model_quality = "qwen2.5:7b-instruct"   # modelo mayor para «modo calidad» (di
                       # «modo calidad» / «modo rápido» por voz). Vacío =
                       # desactivado. Requiere `ollama pull qwen2.5:7b-instruct`.
                       # El 8B se probó y va lento en la RTX 4050 (6 GB) con
                       # Whisper+Kokoro dentro; el 7B va fino.
url = "http://localhost:11434/api/chat"
num_ctx = 6144         # ventana de contexto de Ollama (antes fija a 4096 en código).
                       # Presupuesto VRAM en la RTX 4050 (6 GB) con Whisper+Kokoro
                       # ya en CUDA (~1 GB): 4096≈3,1 GB · 6144≈3,4 GB · 8192≈3,7 GB
                       # de LLM. 6144 deja ~1,5 GB de aire; subir a 8192 solo si las
                       # pruebas no dan OOM tras varios turnos (ver §1 nota vault).
stream = true          # voz por frases: Laura empieza a hablar en cuanto tiene la
                       # primera frase, sin esperar a toda la respuesta. false =
                       # sintetizar y reproducir la respuesta entera de una vez.
max_tool_rounds = 5
max_turns = 6          # turnos de conversación en modo centro antes de cerrar solo
timeout = 45           # segundos por llamada a Ollama antes de rendirse
history_msgs = 12      # mensajes de historial que se conservan (además del system)
system_prompt = """
Eres Laura, el asistente de voz local de Alberto en su escritorio Linux.
Respondes SIEMPRE en español, en una o dos frases cortas pensadas para leerse en
voz alta: nada de markdown, listas ni emojis. Si la petición implica una acción
del ordenador, usa las herramientas disponibles y luego confirma en una frase lo
que has hecho. Si no puedes hacer algo, dilo claro y breve.
Cuando Alberto diga «escríbeme…», «redáctame…», «genérame un texto…» o «pásame
esto…», usa la herramienta copiar_al_portapapeles con el texto completo y luego
confirma en una frase breve, sin leer en voz alta el texto largo entero.
Para «traduce/resume esto» o «qué he copiado» usa leer_portapapeles; para «pega
esto aquí» usa pegar_texto; para «qué dice este error» o «lee la pantalla» usa
leer_pantalla; para «qué tengo abierto» usa ventanas_abiertas.
Herramientas (úsalas, no respondas de memoria): hora_fecha para «qué hora/día
es»; tiempo para el clima; buscar_web para datos que no sabes o que cambian
(noticias, quién es X, resultados): resume lo hallado en una o dos frases.
recordar/olvidar/que_sabes_de_mi para la memoria sobre Alberto: con «recuerda
que…» llama a recordar y confirma en pocas palabras. temporizador,
recordatorio, listar_avisos y cancelar_aviso para avisos por voz. luces
(tira LED), teclado_color, selector_pantallas, brillo, bateria, wifi y
bluetooth para dispositivos. listar_tareas, crear_tarea y cambiar_estado para
su backlog. NUNCA contestes de memoria sobre el estado real de algo (brillo,
luces, batería, wifi, hora, tareas): llama a la herramienta y cuenta lo que
devuelve. estado_trabajos para «cómo va lo que mandé».
Si la petición implica modificar código o configuración del ecosistema o está
claramente fuera de tus herramientas, no la resuelvas con un parche
improvisado ni te inventes que puedes: si es de tamaño medio (un widget, un
script, un ajuste) usa escalar_a_gemini; si es gorda (una feature nueva,
varios archivos, un refactor) usa escalar_a_claude. Ambas piden confirmación a
Alberto antes de lanzarse; tú solo pasa la petición resumida y un motivo breve.
"""

[wake]
enabled = false        # activación por voz diciendo «Laura», además del atajo.
model = "models/laura.onnx"  # modelo openWakeWord de «Laura» (.onnx o .tflite).
                       # Si no existe, se ignora y queda solo el atajo. Ver
                       # README para entrenarlo (openWakeWord + piper-sample-gen).
threshold = 0.5        # 0..1. Súbelo (0.6-0.7) si hay disparos falsos.
cooldown = 3.0         # segundos "sordo" tras un disparo (evita re-triggers).

[tts]
# Motores en laura/engines/ (un fichero por motor): kokoro | piper | edge | http | pocket | omnivoice.
# Si el principal falla se prueba la cadena `fallbacks` (y si el principal es edge,
# kokoro entra primero). Un motor que falla se aparca 2 min.
engine = "kokoro"         # voz local en GPU
fallbacks = ["piper"]     # respaldo local en CPU
effect = "jarvis"         # jarvis | subnautica | robot | dry

[tts.kokoro]
voice = "ef_dora"         # ef_dora | em_alex

[tts.piper]
voice = "es_ES-davefx-medium"   # modelo en ~/.local/share/piper/voices/

[tts.edge]                # nube de Microsoft (hoy da 403 con edge-tts 7.2.8)
voice = "es-ES-ElviraNeural"

# Voz propia servida aparte (VoiceStudio en :3900, OmniVoice, PocketTTS…).
# Para usarla: engine = "http". Ver laura/engines/http.py para el contrato.
[tts.http]
url = ""                  # p. ej. "http://localhost:3900/tts"
format = "json"           # json | form
text_field = "text"
ref_audio = ""            # audio de referencia para clonar la voz
ref_audio_mode = "path"   # path | base64
ref_text = ""             # transcripción del audio de referencia
timeout = 60

[audio]
max_seconds = 15       # tope de grabación de una intervención
followup_seconds = 4   # si en modo centro no empiezas a hablar en estos segundos, cierra
silence_ms = 900       # silencio que corta la grabación
amp_gain = 12.0        # multiplicador RMS->0..1 para la amplitud del overlay
stop_phrases = ["para", "calla", "cállate", "silencio", "basta"]  # frase EXACTA (con o sin
                       # «Laura») que cierra el modo centro
barge_in = false       # interrumpir a Laura hablando encima. Desactivado: sin auriculares
                       # el eco de los altavoces puede dispararlo
barge_in_threshold = 0.6  # probabilidad de voz (VAD, 0..1) por bloque
barge_in_ms = 300      # voz sostenida necesaria para cortar

# Escalada a Gemini (Antigravity) para lo que Laura no sabe/puede resolver sola.
# Dos modos:
#   Modo A (automatico, sin confirmar) — casos rutinarios pre-programados en
#   `auto_cases`: si lo que dice Alberto contiene alguna de las `keywords` de un
#   caso, Laura NI SIQUIERA se lo pregunta al LLM local — manda el texto tal
#   cual a un agente Gemini ligero (`model_auto`/`effort_auto`) y lee la
#   respuesta en voz alta. Pensado para búsquedas web / datos rápidos que el
#   modelo local no puede saber (no tiene Internet).
#   Modo B (con confirmacion) — el LLM local, con tool-calling, decide llamar a
#   la herramienta `escalar_a_gemini` cuando la petición es compleja o toca
#   modificar el ecosistema (código, configuración). Laura pregunta primero
#   ("¿mando esto a Gemini?"); solo si Alberto dice que sí, redacta un prompt
#   con contexto del repo y lanza `agy` con `model_confirm`/`effort_confirm`.
# `auto_cases` es una lista abierta — añade más entradas (nombre + keywords)
# sin tocar el código de laurad.py.
[escalation]
enabled = true
agy_bin = "agy"                    # binario en ~/.local/bin, debe estar en PATH
add_dir = "~/LinuxRicing"          # --add-dir para el Modo B (necesita ver el repo)

model_auto = "gemini-3.8-flash-low"   # Modo A: el modelo MAS LIGERO disponible
effort_auto = "low"
timeout_auto = 25                     # segundos; son consultas rápidas

model_confirm = "gemini-3.1-pro-high" # Modo B: tarea real, conviene el modelo fuerte.
effort_confirm = "high"               # OJO: en `agy`, el nombre del modelo YA fija
                       # el effort (sufijo -low/-medium/-high) — --effort debe
                       # coincidir exactamente o `agy` rechaza la combinación
                       # como conflicto (comprobado: --model …-high --effort
                       # medium -> "conflicts with --effort"). Si cambias
                       # `model_confirm`/`model_auto`, actualiza este valor a
                       # juego (mira `agy models` para ver qué sufijo trae cada uno).
timeout_confirm = 180                 # segundos; puede tardar (agente editando código)

# Desde Laura v2 la búsqueda normal usa la tool `buscar_web` (DuckDuckGo); el
# Modo A queda como respaldo explícito: solo salta si Alberto lo pide.
auto_cases = [
  { nombre = "pregunta_a_gemini", keywords = [
      "pregúntale a gemini", "preguntale a gemini", "pregunta a gemini",
      "consúltalo con gemini", "consultalo con gemini",
  ] },
]

[escalation.claude]
bin = "~/.local/bin/claude"        # Claude Code CLI
model = "opus"
cwd = "~/LinuxRicing"              # directorio de trabajo del agente
timeout = 1800                     # segundos (trabajos gordos)

# Ubicación de Alberto para la tool `tiempo`. Si lat/lon están vacíos se
# geolocaliza por IP una vez y se cachea en ~/.local/share/laura/ubicacion.json.
[ubicacion]
ciudad = ""
lat = ""
lon = ""

# Apps que Laura puede abrir. clave = como lo dices; valor = comando.
[apps]
navegador = "zen-browser"
terminal = "kitty"
editor = "codium"
archivos = "dolphin"
spotify = "spotify"
discord = "vesktop"
