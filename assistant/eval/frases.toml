# Banco de frases para el examen de modelos de Laura.
# espera = herramientas esperadas en orden ([] = responder sin herramienta).
# args   = (opcional) lista alineada con `espera`; cada elemento son los args clave
#          esperados. Cadenas: subcadena sin tildes ni mayusculas. Numeros: exactos.
# grupo  = etiqueta libre para el desglose ("trampa" cuenta para falsos positivos).

