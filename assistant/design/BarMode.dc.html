<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #120d10; --bar: #171015; --surface-hi: #261d22; --outline: #50454c;
      --text: #f3e1e9; --subtext: #b7a7af; --primary: #e9b8d8; --tertiary: #ead4ff;
      --success: #b5ccba;
      --font: "Google Sans Flex", "Google Sans", "Figtree", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    a { color: var(--primary); } a:hover { color: var(--tertiary); }

    .stage { width: 1180px; height: 640px; position: relative; overflow: hidden;
      background: radial-gradient(130% 100% at 0% 45%, #1b1218 0%, #130e11 55%, #0b080a 100%); }

    /* barra vertical de Caelestia, borde izquierdo */
    .bar { position: absolute; top: 0; bottom: 0; left: 0; width: 46px;
      background: var(--bar); border-right: 1px solid rgba(80,69,76,0.45);
      display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 16px; }
    .bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3035; }
    .bar .dot.ws { background: var(--primary); box-shadow: 0 0 8px 1px rgba(233,184,216,0.55); }
    .bar .spacer { flex: 1; }
    .bar .aur { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
      background: rgba(233,184,216,0.12); border: 1px solid rgba(233,184,216,0.28); }
    .bar .glyph { width: 5px; height: 5px; border-radius: 50%; background: var(--primary);
      box-shadow: 0 0 8px 2px rgba(233,184,216,0.8); }

    .caption { position: absolute; top: 26px; left: 78px; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--subtext); font-weight: 600; }

    /* la gota: pegada al borde izquierdo del área de contenido, con "cuello" hacia la barra */
    .scene { position: absolute; left: 46px; display: flex; align-items: center; gap: 0; }
    .neck { width: 14px; height: 22px; background: var(--surface-hi);
      border-top: 1px solid rgba(80,69,76,0.6); border-bottom: 1px solid rgba(80,69,76,0.6);
      clip-path: polygon(0 22%, 100% 0, 100% 100%, 0 78%); }
    .gota { background: var(--surface-hi); border: 1px solid var(--outline); border-left: none;
      border-radius: 4px 18px 18px 4px; box-shadow: 0 18px 46px -16px rgba(0,0,0,0.8), 0 0 0 1px rgba(233,184,216,0.05);
      backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; }
    .gota .ring { flex: none; }
    .gota .label { font-size: 13.5px; font-weight: 500; color: var(--text); white-space: nowrap; }
    .gota .rows { display: flex; flex-direction: column; gap: 7px; }
    .gota .r { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text); white-space: nowrap; }
    .gota .r .ic { width: 15px; height: 15px; flex: none; display: grid; place-items: center; }

    .lbl { position: absolute; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase;
      color: var(--subtext); font-weight: 600; }

    @keyframes bars { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .b { animation: bars 1s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .b:nth-child(2){animation-delay:.15s} .b:nth-child(3){animation-delay:.3s} .b:nth-child(4){animation-delay:.45s}
    .spin { animation: spin 2s linear infinite; transform-origin: center; }
    .breathe { animation: breathe 3.4s ease-in-out infinite; }
  </style>
</helmet>

<div class="stage">
  <div class="bar">
    <div class="dot ws"></div><div class="dot"></div><div class="dot"></div>
    <div class="spacer"></div>
    <div class="aur"><div class="glyph breathe"></div></div>
    <div class="spacer"></div>
    <div class="dot"></div><div class="dot"></div>
  </div>
  <div class="caption">Modo barra · la gota · comandos rápidos</div>

  <!-- REPOSO -->
  <div class="lbl" style="top: 96px; left: 78px;">Reposo — solo el icono en la barra</div>
  <div class="scene" style="top: 118px;">
    <div class="neck" style="opacity: 0.35;"></div>
    <div class="gota" style="padding: 8px 12px; opacity: 0.6;">
      <svg class="ring" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b7a7af" stroke-width="1.6">
        <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2" fill="#b7a7af" stroke="none"/>
      </svg>
    </div>
  </div>

  <!-- ESCUCHANDO -->
  <div class="lbl" style="top: 196px; left: 78px;">Escuchando — anillo HUD + onda de tu voz</div>
  <div class="scene" style="top: 218px;">
    <div class="neck"></div>
    <div class="gota">
      <svg class="ring" width="30" height="30" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="16" stroke="#e9b8d8" stroke-width="5" stroke-dasharray="0.9 6" opacity="0.4"/>
        <circle cx="20" cy="20" r="13" stroke="#e9b8d8" stroke-width="1.5"/>
        <g transform="translate(20 20)">
          <rect class="b" x="-8" y="-3" width="2.4" height="6" rx="1.2" fill="#ead4ff"/>
          <rect class="b" x="-3.5" y="-7" width="2.4" height="14" rx="1.2" fill="#e9b8d8"/>
          <rect class="b" x="1" y="-9" width="2.4" height="18" rx="1.2" fill="#f6d2ea"/>
          <rect class="b" x="5.5" y="-5" width="2.4" height="10" rx="1.2" fill="#ead4ff"/>
        </g>
      </svg>
      <span class="label">Escuchando…</span>
    </div>
  </div>

  <!-- PENSANDO -->
  <div class="lbl" style="top: 300px; left: 78px;">Pensando — arco que orbita</div>
  <div class="scene" style="top: 322px;">
    <div class="neck"></div>
    <div class="gota">
      <svg class="ring" width="30" height="30" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="14" stroke="#50454c" stroke-width="2"/>
        <circle class="spin" cx="20" cy="20" r="14" stroke="#e9b8d8" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="16 70"/>
      </svg>
      <span class="label" style="color: var(--subtext);">«sube el brillo al máximo»</span>
    </div>
  </div>

  <!-- RESULTADO (multi-acción) -->
  <div class="lbl" style="top: 404px; left: 78px;">Resultado — una fila por acción, se colapsa sola</div>
  <div class="scene" style="top: 426px;">
    <div class="neck" style="height: 30px;"></div>
    <div class="gota" style="align-items: flex-start; padding: 14px 20px 14px 14px;">
      <svg class="ring" width="30" height="30" viewBox="0 0 40 40" fill="none" style="margin-top: 2px;">
        <circle cx="20" cy="20" r="16" stroke="#e9b8d8" stroke-width="5" stroke-dasharray="0.9 6" opacity="0.35"/>
        <circle cx="20" cy="20" r="13" stroke="#e9b8d8" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="5" fill="#e9b8d8" opacity="0.3"/>
      </svg>
      <div class="rows">
        <div class="r">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b5ccba" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          Volumen al 60 %
        </div>
        <div class="r">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b5ccba" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          Google abierto
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
