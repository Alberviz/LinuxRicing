<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
  <style>
    :root { --bg:#120d10; --text:#f3e1e9; --subtext:#b7a7af; --primary:#e9b8d8; --tertiary:#ead4ff;
      --font:"Google Sans Flex","Google Sans","Figtree",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); }
    a { color:var(--primary); } a:hover { color:var(--tertiary); }
    .stage { width:620px; height:620px; position:relative; overflow:hidden;
      background:radial-gradient(120% 100% at 50% 42%,#181117,#100b0e 58%,#09070a 100%);
      display:grid; grid-template-rows:1fr auto; }
    .wrap { display:grid; place-items:center; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:0.55; } 50% { opacity:1; } }
    .rot { animation:spin 18s linear infinite; transform-origin:center; }
    .rot2 { animation:spin 26s linear infinite reverse; transform-origin:center; }
    .core { animation:pulse 3s ease-in-out infinite; }

    .cap { padding:26px 32px 30px; }
    .cap h3 { margin:0 0 4px; font-size:15px; letter-spacing:2px; text-transform:uppercase; color:var(--text); font-weight:600; }
    .cap p { margin:0; font-size:13px; color:var(--subtext); line-height:1.5; }
  </style>
</helmet>
<div class="stage">
  <div class="wrap">
    <svg width="280" height="280" viewBox="0 0 280 280" fill="none">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f6d2ea" stop-opacity="0.55"/>
          <stop offset="70%" stop-color="#e9b8d8" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="140" cy="140" r="120" fill="url(#g)"/>
      <g class="rot" stroke="#e9b8d8" stroke-width="1" opacity="0.5">
        <ellipse cx="140" cy="140" rx="104" ry="104"/>
        <ellipse cx="140" cy="140" rx="104" ry="60"/>
        <ellipse cx="140" cy="140" rx="104" ry="28"/>
        <ellipse cx="140" cy="140" rx="60" ry="104"/>
        <ellipse cx="140" cy="140" rx="28" ry="104"/>
      </g>
      <g class="rot2" fill="#ead4ff">
        <circle cx="140" cy="36" r="2.4"/><circle cx="140" cy="244" r="2.4"/>
        <circle cx="36" cy="140" r="2.4"/><circle cx="244" cy="140" r="2.4"/>
        <circle cx="72" cy="72" r="1.8"/><circle cx="208" cy="72" r="1.8"/>
        <circle cx="72" cy="208" r="1.8"/><circle cx="208" cy="208" r="1.8"/>
        <circle cx="140" cy="80" r="1.6" opacity="0.7"/><circle cx="140" cy="200" r="1.6" opacity="0.7"/>
        <circle cx="88" cy="140" r="1.6" opacity="0.7"/><circle cx="192" cy="140" r="1.6" opacity="0.7"/>
      </g>
      <circle class="core" cx="140" cy="140" r="18" fill="#f6d2ea" opacity="0.8"/>
      <circle cx="140" cy="140" r="26" stroke="#e9b8d8" stroke-width="1.5"/>
    </svg>
  </div>
  <div class="cap">
    <h3>Orbe · Malla</h3>
    <p>Esfera de líneas y puntos de luz que rotan, con un núcleo que late. Más "IA / holograma",
       tipo HUD pero suave. Escuchando: los puntos vibran; pensando: rota más rápido.</p>
  </div>
</div>
</x-dc>
</body>
</html>
