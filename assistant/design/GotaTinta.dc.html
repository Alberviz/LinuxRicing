<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
  <style>
    :root { --bg:#120d10; --bar:#171015; --ink:#f4e3ec; --subtext:#b7a7af;
      --primary:#e9b8d8; --tertiary:#ead4ff;
      --font:"Google Sans Flex","Google Sans","Figtree",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font); background:var(--bg); color:var(--ink); }
    a { color:var(--primary); } a:hover { color:var(--tertiary); }
    .stage { width:560px; height:380px; position:relative; overflow:hidden;
      background:#100b0e; }
    .bar { position:absolute; top:0; bottom:0; left:0; width:44px; background:var(--bar);
      display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:14px; }
    .bar .d { width:7px; height:7px; border-radius:50%; background:#3a3035; }
    .bar .d.on { background:var(--primary); }
    .bar .aur { width:24px; height:24px; border-radius:6px; background:var(--primary); }
    .bar .sp { flex:1; }

    .scene { position:absolute; left:44px; top:126px; display:flex; align-items:stretch; }
    .neck { width:18px; align-self:center; height:40px; background:var(--primary);
      clip-path:polygon(0 22%,100% 0,100% 100%,0 78%); }
    .gota { background:var(--primary); color:#3a2136; border-radius:0 16px 16px 0;
      padding:14px 22px 14px 16px; display:flex; gap:14px; align-items:flex-start;
      box-shadow:0 16px 40px -14px rgba(233,184,216,0.35); }
    .ring { flex:none; margin-top:1px; }
    .rows { display:flex; flex-direction:column; gap:6px; }
    .r { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; }
    .r .dot { width:6px; height:6px; border-radius:50%; background:#3a2136; flex:none; }

    .tag { position:absolute; left:78px; top:88px; font-size:11px; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--subtext); font-weight:700; }
    .cap { position:absolute; left:78px; bottom:24px; right:24px; font-size:12.5px; color:var(--subtext); line-height:1.5; }
  </style>
</helmet>
<div class="stage">
  <div class="bar">
    <div class="d on"></div><div class="d"></div><div class="sp"></div>
    <div class="aur"></div><div class="sp"></div><div class="d"></div>
  </div>
  <div class="tag">Gota · Tinta plana</div>
  <div class="scene">
    <div class="neck"></div>
    <div class="gota">
      <svg class="ring" width="26" height="26" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="15" stroke="#3a2136" stroke-width="4" stroke-dasharray="0.8 6"/>
        <circle cx="20" cy="20" r="11" stroke="#3a2136" stroke-width="2"/>
        <circle cx="20" cy="20" r="4" fill="#3a2136"/>
      </svg>
      <div class="rows">
        <div class="r"><span class="dot"></span>Volumen al 60 %</div>
        <div class="r"><span class="dot"></span>Google abierto</div>
      </div>
    </div>
  </div>
  <div class="cap">Bloque de color sólido, sin transparencias. Contundente, se lee de un vistazo, contrasta fuerte con el escritorio.</div>
</div>
</x-dc>
</body>
</html>
